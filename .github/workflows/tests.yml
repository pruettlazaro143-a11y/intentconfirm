name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skill records
        run: python -m unittest discover -s .bob/skills/intentconfirm/scripts -p 'test_*.py'
      - name: Optional web prototype
        run: npm test
      - name: Distribution installer and package
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/package_skill.py --check
